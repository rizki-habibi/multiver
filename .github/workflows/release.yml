name: Build & Publish CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (tidak publish)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Install CLI deps
        run: npm install --prefix cli --no-audit --no-fund

      - name: Build CLI bundle
        run: npm run cli:build

      - name: Verify bundle
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('cli/package.json','utf8'));
            console.log('CLI version:', p.version);
            if (!fs.existsSync('cli/cli.js')) throw new Error('cli/cli.js tidak ada setelah build');
            if (!fs.existsSync('cli/app/package.json')) throw new Error('cli/app/package.json hilang');
            console.log('Build OK');
          "

      - name: Pack (dry-run check)
        run: npm pack --prefix cli --pack-destination /tmp
        env:
          NODE_ENV: production

      - name: Publish to npm (optional)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN tidak tersedia — lewati npm publish; GitHub Release tetap menjadi sumber update."
            exit 0
          fi
          npm publish --prefix cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: multiver-tgz
          path: /tmp/multiver-*.tgz
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION=$(node -p "JSON.parse(require(\"fs\").readFileSync(\"cli/package.json\",\"utf8\")).version")
            TAG="v$VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="v$VERSION"
          fi
          echo "Publishing Multiver release $TAG (version $VERSION)"
          TARBALL=$(ls /tmp/multiver-*.tgz | head -n 1)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: CLI tarball tidak ditemukan"
            exit 1
          fi
          cp "$TARBALL" /tmp/multiver-latest.tgz
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" "$TARBALL" /tmp/multiver-latest.tgz --clobber
