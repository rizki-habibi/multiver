name: Auto Version & Tag

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "*.md"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: multiver-auto-version-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip version]')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changed: ${{ steps.bump.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Compute next version
        id: bump
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # Ambil semua tag yang sudah ada
          git fetch --tags --quiet || true
          LATEST_TAG=$(git tag --list "v*" --sort=-v:refname | head -n 1 || true)
          echo "latest_tag=${LATEST_TAG:-none}" >> "$GITHUB_OUTPUT"

          NEXT="$CURRENT"
          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
            # Patch bump dari tag terbaru
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          else
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT=$(echo "$CURRENT" | cut -d. -f1).$(echo "$CURRENT" | cut -d. -f2).$PATCH
          fi

          # Jika package.json version lebih besar/sama dari tag, bandingkan sebagai
          # numeric semver (bukan string lexicographic: 12.1.9 > 12.1.38 itu salah).
          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
            HIGHER=$(CURRENT="$CURRENT" BASE="$BASE" node <<'NODE'
          const parse = (value) => {
            const m = String(value || "").trim().match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!m) throw new Error(`Invalid numeric semver: ${value}`);
            return m.slice(1).map(Number);
          };
          const a = parse(process.env.CURRENT);
          const b = parse(process.env.BASE);
          let cmp = 0;
          for (let i = 0; i < 3; i += 1) {
            if (a[i] !== b[i]) { cmp = a[i] - b[i]; break; }
          }
          process.stdout.write(cmp >= 0 ? "yes" : "no");
          NODE
          )
            if [ "$HIGHER" = "yes" ]; then
              NEXT="$CURRENT"
              PATCH=$(echo "$NEXT" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              NEXT=$(echo "$NEXT" | cut -d. -f1).$(echo "$NEXT" | cut -d. -f2).$PATCH
            fi
          fi

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          CHANGED=$([ "$NEXT" != "$CURRENT" ] && echo true || echo false)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT → Next: $NEXT (tag: ${LATEST_TAG:-none})"
          echo "Changed: $CHANGED"

      - name: Update package and lockfile versions
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          NEXT="${{ steps.bump.outputs.version }}"
          NEXT="$NEXT" node <<'NODE'
          const fs = require("fs");
          const next = process.env.NEXT;

          const updateJson = (file, mutate) => {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            mutate(data);
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
            console.log("bumped", file, "→", next);
          };

          updateJson("package.json", (p) => { p.version = next; });
          updateJson("cli/package.json", (p) => { p.version = next; });

          for (const file of ["package-lock.json", "cli/package-lock.json"]) {
            if (!fs.existsSync(file)) continue;
            updateJson(file, (lock) => {
              lock.version = next;
              if (lock.packages && lock.packages[""]) {
                lock.packages[""].version = next;
              }
            });
          }
          NODE

      - name: Verify version consistency
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          NEXT="${{ steps.bump.outputs.version }}"
          NEXT="$NEXT" node <<'NODE'
          const fs = require("fs");
          const expected = process.env.NEXT;
          const files = ["package.json", "cli/package.json", "package-lock.json", "cli/package-lock.json"];

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            if (data.version !== expected) {
              throw new Error(file + ": version " + data.version + " != " + expected);
            }
            if (file.endsWith("package-lock.json") && data.packages?.[""]?.version !== expected) {
              throw new Error(file + ': packages[""].version ' + data.packages?.[""]?.version + " != " + expected);
            }
          }
          console.log("Version metadata konsisten:", expected);
          NODE

      - name: Commit version bump
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          NEXT="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json cli/package.json package-lock.json cli/package-lock.json
          git commit -m "chore: bump version to v$NEXT [skip version]"
          git push

      - name: Create GitHub release + tag
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT="${{ steps.bump.outputs.version }}"
          # Tag harus dibuat eksplisit: sebelumnya hanya release (lightweight
          # object) yang dibuat, jadi `git tag --list v*` kosong dan update
          # versi lokal tidak punya acuan untuk "sudah terbaru".
          git tag -a "v$NEXT" -m "v$NEXT" || true
          git push origin "refs/tags/v$NEXT" || true
          gh release create "v$NEXT" \
            --title "v$NEXT" \
            --notes "Auto-version bump dari commit ${{ github.sha }}

          Jalankan update lokal:
          \`\`\`
          multiver update
          \`\`\`
          Atau dari source:
          \`\`\`
          git pull && npm install && npm run build
          \`\`\`" \
            --generate-notes || echo "release create best-effort"
